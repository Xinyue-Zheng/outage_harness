<title>Loop Trace Explorer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: the loop graph on top (SVG, nodes in loop order, conditional edges); a run tree on the left
   (steps, each expandable to its node spans with durations); the inspector on the right (input and
   output of the selected node at the selected step). Playback lights the nodes of a step one by one.
   All content is read from RUN_DATA; the Copilot's export script replaces it. */
:root {
  --bg: #f7f6f2; --fg: #1d1f22; --muted: #5d6168; --line: #d9d6cc; --panel: #ffffff; --panel2: #efede6;
  --rendered: #1f5f8b; --concat: #8a5a1f; --ok: #2f7d4a; --warn: #b7791f; --bad: #b23b3b; --lit: #e9b949;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15171a; --fg: #e8e6e0; --muted: #a2a6ad; --line: #33373d; --panel: #1e2126; --panel2: #262a30;
  --rendered: #7fb3dc; --concat: #d9a461; --ok: #6cc08a; --warn: #e0a84a; --bad: #e06b6b; --lit: #f0c75e; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #15171a; --fg: #e8e6e0; --muted: #a2a6ad; --line: #33373d; --panel: #1e2126; --panel2: #262a30;
  --rendered: #7fb3dc; --concat: #d9a461; --ok: #6cc08a; --warn: #e0a84a; --bad: #e06b6b; --lit: #f0c75e; color-scheme: dark }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 24px; }
.app { max-width: 1400px; margin: 0 auto; display: grid; gap: 12px; }
header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
h1 { font-size: 20px; font-weight: 600; margin: 0; }
.placeholder { font-family: var(--font-mono); font-size: 11px; padding: 2px 8px; border: 1px dashed var(--warn); color: var(--warn); border-radius: 3px; }
.tabs { display: flex; gap: 6px; } .tabs button { font: inherit; font-weight: 500; padding: 5px 12px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 4px; cursor: pointer; }
.tabs button[aria-pressed="true"] { border-color: var(--c); color: var(--c); box-shadow: inset 0 -3px var(--c); }
button:focus-visible { outline: 2px solid var(--rendered); outline-offset: 2px; }
.graph { background: var(--panel); border: 1px solid var(--line); padding: 6px; }
.panels { display: grid; gap: 14px; }
.panels.side { grid-template-columns: 1fr 1fr; }
@media (max-width: 1100px) { .panels.side { grid-template-columns: 1fr; } }
.panel { display: grid; gap: 10px; min-width: 0; }
.panel .ph { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; border-bottom: 3px solid var(--c); padding-bottom: 4px; }
.panel .ph .name { font-weight: 600; color: var(--c); } .panel .ph .desc { font-size: 12px; color: var(--muted); }
.panels.side .body { grid-template-columns: 1fr; }
.panels.side .tree { max-height: 32vh; }
.gn.absent rect { stroke-dasharray: 3 3; opacity: 0.45; } .gn.absent text { opacity: 0.5; }
.graph svg { width: 100%; height: auto; display: block; max-width: 100%; }
.gn rect { fill: var(--panel2); stroke: var(--line); stroke-width: 1.2; rx: 6; }
.gn text { font-family: var(--font-mono); font-size: 11.5px; fill: var(--fg); }
.gn.ran rect { stroke: var(--c); stroke-width: 1.6; }
.gn.active rect { fill: var(--lit); stroke: var(--fg); }
.gn.model rect { stroke: #c0761a; }
.gn.bad rect { stroke: var(--bad); stroke-width: 2; } .gn.end rect { stroke: var(--ok); stroke-width: 2; }
.gn.sel rect { stroke-width: 3; }
.gn { cursor: pointer; }
.ge { stroke: var(--line); stroke-width: 1.2; fill: none; } .ge.ran { stroke: var(--c); stroke-width: 2; }
.gl { font-family: var(--font-mono); font-size: 10px; fill: var(--muted); }
.controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.controls button { font: inherit; padding: 5px 12px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 4px; cursor: pointer; }
.controls .stepno { font-family: var(--font-mono); min-width: 12ch; } .controls label { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.body { display: grid; grid-template-columns: 300px 1fr; gap: 12px; min-height: 420px; }
@media (max-width: 860px) { .body { grid-template-columns: 1fr; } }
.tree, .inspector { background: var(--panel); border: 1px solid var(--line); min-width: 0; }
.tree { overflow: auto; max-height: 70vh; }
.trow { display: grid; grid-template-columns: 1fr auto; gap: 6px; padding: 6px 10px; border-bottom: 1px solid var(--line); cursor: pointer; align-items: baseline; }
.trow:hover { background: var(--panel2); } .trow.cur { background: var(--panel2); box-shadow: inset 3px 0 var(--c); }
.trow .t { font-weight: 500; } .trow .d { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.trow .s { font-size: 11px; color: var(--muted); grid-column: 1 / -1; }
.span { display: grid; grid-template-columns: 14px 1fr auto; gap: 6px; padding: 3px 10px 3px 22px; font-size: 12px; cursor: pointer; align-items: center; }
.span:hover { background: var(--panel2); } .span.cur { color: var(--c); font-weight: 500; }
.span .bar { height: 6px; background: var(--c); opacity: 0.5; border-radius: 2px; min-width: 2px; }
.span .d { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.inspector { padding: 12px 14px; display: grid; gap: 10px; align-content: start; }
.inspector h2 { margin: 0; font-size: 15px; font-weight: 600; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.inspector h2 .d { font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-weight: 400; }
.inspector h3 { margin: 0; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
pre { margin: 0; font-family: var(--font-mono); font-size: 12px; white-space: pre-wrap; word-break: break-word; background: var(--panel2); border: 1px solid var(--line); padding: 8px 10px; max-height: 260px; overflow: auto; }
.pill { display: inline-block; font-size: 11.5px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); }
.pill.ok { color: var(--ok); border-color: var(--ok); } .pill.warn { color: var(--warn); border-color: var(--warn); } .pill.bad { color: var(--bad); border-color: var(--bad); }
.tip { position: fixed; z-index: 20; background: var(--fg); color: var(--bg); font-size: 12px; padding: 6px 10px; border-radius: 4px; max-width: 320px; pointer-events: none; }
.tip[hidden] { display: none; }
kbd { font-family: var(--font-mono); font-size: 11px; border: 1px solid var(--line); border-radius: 3px; padding: 0 5px; }
@media (prefers-reduced-motion: reduce) { .gn rect, .ge { transition: none; } }
.gn rect, .ge { transition: stroke 0.2s, fill 0.2s; }
</style>

<div class="app" id="app">
  <header>
    <div><h1>Loop Trace Explorer</h1><div style="color:var(--muted);font-size:13px">Every node of the loop, what went in and what came out, step by step. Hover a node for its summary; click it for the full input and output. <span class="placeholder" id="ph">placeholder data from the synthetic case; RUN_DATA is exported from the real run directories</span></div></div>
    <div class="tabs" id="tabs"></div>
  </header>
  <div class="controls">
    <button id="prev">Previous step</button><button id="next">Next step</button><button id="play">Play</button>
    <span class="stepno" id="stepno"></span>
    <label><input type="checkbox" id="auto" checked> animate nodes within a step</label>
    <label><input type="checkbox" id="side"> both designs side by side</label>
    <span style="font-size:12px;color:var(--muted)">Keys <kbd>←</kbd> <kbd>→</kbd> <kbd>space</kbd></span>
  </div>
  <div id="panels" class="panels"></div>
</div>
<div class="tip" id="tip" hidden></div>

    ] },
    { id: "concat", label: "Codex-style concat", desc: "transcript of replies and raw tool output; the model decides the end",
      graph: { subs: { render_context: "transcript append", validate_action: "schema only", completion_checks: "recorded, not enforced", update_state: "hidden State", loop_guards: "caps only" },
               absent: ["verifier", "end_program_stop"] }, steps: [
      { step: 0, title: "Initialisation", kind: "init", spans: [
        span("initialize", 1, "ok", "saved OSM payload of the rendered run reused", "", "6 areas derived, identical to the rendered run"),
        span("update_state", 3, "ok", "State 0 (hidden from the model)", "", "transcript: system prefix only (skill, task, area list, tool declarations)") ] },
      { step: 1, title: "query metadata", kind: "q", spans: [

        span("llm_call", 24, "ok", "query_basic_information ARL02850", "", '{"gap": {"targets": ["ARL02850"], "question": "Where is the site and what technology?"}, "action": {"function": "query_basic_information", "parameters": {"station_id": "ARL02850"}}}'),
        span("parse", 0.01, "ok", "ok", "", ""), span("validate_action", 0.01, "ok", "schema valid", "", ""),
        span("execute_query", 6, "ok", "1 row (already fetched at initialisation; the transcript did not show it)", "", "artifacts/metadata_step_01.csv"),
        span("update_state", 0.3, "ok", "transcript += reply + raw CSV", "", "completion (recorded, not shown): boundary unknown") ] },
      { step: 2, title: "query S01", kind: "q", spans: [
        span("render_context", 0.05, "ok", "14,900 chars", TX(14900, 1), ""),
        span("llm_call", 22, "ok", "query_area_coverage S01", "", ""), span("parse", 0.01, "ok", "ok", "", ""), span("validate_action", 0.01, "ok", "schema valid; area listed", "", ""),
        span("execute_query", 190, "ok", "143 point calls; raw output 1.1 MB", "", "artifacts/step_02_S01.json"),
        span("update_state", 0.4, "ok", "transcript += truncated output: the model sees 9 of 143 locations", "", "completion (recorded): east open (R02), south open (S02)") ] },
      { step: 3, title: "query S02", kind: "q", spans: [
        span("render_context", 0.05, "ok", "20,100 chars", TX(20100, 2), ""),
        span("llm_call", 21, "ok", "query_area_coverage S02", "", ""), span("parse", 0.01, "ok", "ok", "", ""), span("validate_action", 0.01, "ok", "schema valid", "", ""),
        span("execute_query", 171, "ok", "160 point calls", "", ""),
        span("update_state", 0.4, "ok", "transcript += truncated output", "", "completion (recorded): east open (R02 never queried), north open (S03)") ] },
      { step: 4, title: "query S03", kind: "q", spans: [
        span("render_context", 0.05, "ok", "25,300 chars", TX(25300, 3), ""),
        span("llm_call", 23, "ok", "query_area_coverage S03", "", ""), span("parse", 0.01, "ok", "ok", "", ""), span("validate_action", 0.01, "ok", "schema valid", "", ""),

        span("update_state", 0.5, "ok", "transcript += truncated output", "", "completion (recorded): east open, east open at the edge") ] },
      { step: 5, title: "KPI backups", kind: "k", spans: [
        span("render_context", 0.05, "ok", "30,600 chars", TX(30600, 4), ""),
        span("llm_call", 25, "ok", "query_lte_rrc_prb B1, B2, one week", "", '{"action": {"function": "query_lte_rrc_prb", "parameters": {"cell_ids": ["B1", "B2"], "start_time": "2026-02-03T09:00:00Z", "end_time": "2026-02-03T12:00:00Z"}}}'),
        span("parse", 0.01, "ok", "ok", "", ""), span("validate_action", 0.01, "ok", "schema valid", "", ""),

        span("completion_checks", 0.2, "warn", "checks recorded, not enforced: boundary unknown, backup_load unknown", "State", "boundary: east 90-120 deg open (R02 never fetched), open at the edge\nbackup_load: KPI baseline not queried for 8 outage sectors"),
        span("end_complete", 12, "warn", "redistribution: no outage-sector baseline, no demand to move; report with unknown capacity", "", "end_reason model_finish\nclasses: loss 40, unknown 191") ] },

};

// Program bookkeeping nodes that every round passes through; the export fills real durations.
for (const c of RUN_DATA.conditions) for (const st of c.steps) {
  const ids = st.spans.map(s => s.node);
  if (ids.includes("update_state") && !ids.includes("write_step")) {
    const i = ids.indexOf("update_state") + 1;
    st.spans.splice(i, 0, span("write_step", 0.05, "ok", "Step record: decision, validation, observation, State after", "", `steps/step_${String(st.step).padStart(2, "0")}/`),
                    span("loop_guards", 0.01, "ok", st.spans.some(s => s.node === "end_program_stop") ? "every check passes at round ≥ 5: program stop" : "caps not hit: next round", "", ""));
    const e = st.spans.findIndex(s => s.node === "end_program_stop");
    if (e >= 0) { const [end] = st.spans.splice(e, 1); st.spans.push(end); }
  }
}
// ---------------------------------------------------------------------------
const $ = (s, el = document) => el.querySelector(s);
const D = RUN_DATA;
let cond = 0, step = 0, playing = false, timer = null, side = false;
const sel = D.conditions.map(() => 0);           // selected span per condition
const maxStep = Math.max(...D.conditions.map(c => c.steps.length));
const pillOf = s => s === "ok" ? "ok" : s === "warn" ? "warn" : "bad";
const dur = s => s >= 60 ? `${Math.floor(s / 60)} min ${Math.round(s % 60)} s` : s >= 1 ? `${Math.round(s)} s` : `${Math.round(s * 1000)} ms`;
const stepOf = ci => D.conditions[ci].steps[step];
const colorOf = ci => `var(--${D.conditions[ci].id})`;

function drawGraph(ci, svg) {
  const c = D.conditions[ci], st = stepOf(ci); const subs = (c.graph && c.graph.subs) || {}; const absent = new Set((c.graph && c.graph.absent) || []);
  const pos = Object.fromEntries(NODES.map(n => [n.id, { x: n.x, y: n.y, w: n.w || W }]));
  const order = st ? st.spans.map(s => s.node) : []; const ran = new Set(order); ran.add("start");
  const activeNode = st ? st.spans[sel[ci]]?.node : null;
  const mid = n => ({ cx: pos[n].x + pos[n].w / 2, cy: pos[n].y + H / 2, l: pos[n].x, r: pos[n].x + pos[n].w, t: pos[n].y, b: pos[n].y + H });
  let g = "";
  for (const [a, b, label, kind] of EDGES) {
    if (absent.has(a) && absent.has(b)) continue;
    const A = mid(a), B = mid(b); const ia = order.indexOf(a), ib = order.indexOf(b);
    const edgeRan = (ia >= 0 && ib > ia) || (a === "start" && ran.has("initialize"));
    let d, lx, ly, anchor = "middle";
    if (kind === "down") { d = `M${A.cx} ${A.b} L${B.cx} ${B.t - 2}`; lx = A.cx + 6; ly = (A.b + B.t) / 2; anchor = "start"; }
    else if (kind === "down-left") { d = `M${A.cx + 30} ${A.b} L${A.cx + 30} ${A.b + 16} L${B.cx + 36} ${A.b + 16} L${B.cx + 36} ${B.t - 2}`; lx = A.cx + 36; ly = A.b + 12; anchor = "start"; }
    else if (kind === "up-right") { d = `M${A.r} ${A.cy - 8} L${B.cx} ${A.cy - 8} L${B.cx} ${B.b + 2}`; lx = (A.r + B.cx) / 2; ly = A.cy - 12; }
    else if (kind === "stop") { d = `M${A.cx - 42} ${A.b} L${A.cx - 42} ${B.cy} L${B.r + 2} ${B.cy}`; lx = A.cx - 36; ly = B.cy + 16; anchor = "start"; }
    else if (kind === "left") { d = `M${A.l} ${A.cy} L${B.r + 2} ${B.cy}`; lx = (A.l + B.r) / 2; ly = A.cy - 6; }
    else if (kind === "arc1") { d = `M${A.cx} ${A.b} L${A.cx} 392 L${B.cx + 35} 392 L${B.cx + 35} ${B.b + 2}`; lx = (A.cx + B.cx) / 2; ly = 386; }
    else if (kind === "arc2") { d = `M${A.cx} ${A.b} L${A.cx} 412 L${B.cx} 412 L${B.cx} ${B.b + 2}`; lx = (A.cx + B.cx) / 2; ly = 406; }
    else if (kind === "arc3") { d = `M${A.cx} ${A.b} L${A.cx} 432 L${B.cx - 40} 432 L${B.cx - 40} ${B.b + 2}`; lx = (A.cx + B.cx) / 2; ly = 426; }
    else { d = `M${A.r} ${A.cy} L${B.l - 2} ${B.cy}`; lx = (A.r + B.l) / 2; ly = A.cy - 6; }
    const dim = absent.has(a) || absent.has(b);
    g += `<path class="ge ${edgeRan ? "ran" : ""}" d="${d}" ${kind === "dash" || label ? 'stroke-dasharray="4 3"' : ""} style="--c:${colorOf(ci)};${dim ? "opacity:.35" : ""}" marker-end="url(#arr${ci})"/>`;
    if (label && !dim) g += `<text class="gl" x="${lx}" y="${ly}" text-anchor="${anchor}">${label}</text>`;
  }
  for (const n of NODES) {
    const p = pos[n.id]; const sp = st ? st.spans.find(s => s.node === n.id) : null; const sub = subs[n.id] !== undefined ? subs[n.id] : n.sub;
    const cls = ["gn", ran.has(n.id) ? "ran" : "", activeNode === n.id ? "active sel" : "", sp && sp.status === "bad" ? "bad" : "", n.id.startsWith("end_") && ran.has(n.id) ? "end" : "", n.model ? "model" : "", absent.has(n.id) ? "absent" : ""].join(" ");
    g += `<g class="${cls}" data-node="${n.id}" style="--c:${colorOf(ci)}"><rect x="${p.x}" y="${p.y}" width="${p.w}" height="${H}" ${n.pill ? 'rx="20"' : ""}/>` +
      `<text x="${p.x + p.w / 2}" y="${p.y + (sub ? 16 : H / 2 + 4)}" text-anchor="middle">${n.label}</text>` +
      (sub ? `<text class="gl" x="${p.x + p.w / 2}" y="${p.y + 30}" text-anchor="middle">${sub}</text>` : "") +
      (sp ? `<text class="gl" x="${p.x + p.w / 2}" y="${p.y + H + 12}" text-anchor="middle" style="fill:var(--c)">${dur(sp.duration_s)}</text>` : "") + `</g>`;
  }
  g += `<text class="gl" x="1000" y="262">solid: always · dashed: conditional · model nodes in orange · dotted: not in this design</text>`;
  svg.innerHTML = `<defs><marker id="arr${ci}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>` + g;
  svg.querySelectorAll(".gn").forEach(el => {
    el.addEventListener("click", () => { const i = st ? st.spans.findIndex(s => s.node === el.dataset.node) : -1; if (i >= 0) { sel[ci] = i; paint(ci); } });
    el.addEventListener("mousemove", e => { const sp = st ? st.spans.find(s => s.node === el.dataset.node) : null; const tip = $("#tip"); if (!sp) { tip.hidden = true; return; } tip.textContent = `${el.dataset.node}: ${sp.summary}`; tip.hidden = false; tip.style.left = Math.min(e.clientX + 12, window.innerWidth - 340) + "px"; tip.style.top = (e.clientY + 12) + "px"; });
    el.addEventListener("mouseleave", () => { $("#tip").hidden = true; });
  });
}

function drawTree(ci, tree) {
  const c = D.conditions[ci];
  tree.innerHTML = c.steps.map((st, i) => {
    const total = st.spans.reduce((a, s) => a + s.duration_s, 0), max = Math.max(...st.spans.map(s => s.duration_s), 0.001);
    const rows = i === step ? st.spans.map((s, j) => `<div class="span ${j === sel[ci] ? "cur" : ""}" data-j="${j}" style="--c:${colorOf(ci)}"><span class="pill ${pillOf(s.status)}" style="width:6px;height:6px;padding:0;border-radius:50%;background:currentColor"></span><span>${s.node}<div class="bar" style="width:${Math.max(2, 100 * s.duration_s / max)}%"></div></span><span class="d">${dur(s.duration_s)}</span></div>`).join("") : "";
    return `<div class="trow ${i === step ? "cur" : ""}" data-i="${i}" style="--c:${colorOf(ci)}"><span class="t">Step ${st.step}: ${st.title}</span><span class="d">${dur(total)}</span><span class="s">${st.spans.length} nodes · ${st.spans.at(-1).summary}</span></div>${rows}`;
  }).join("") + (step >= c.steps.length ? `<div class="trow" style="color:var(--muted)"><span class="t">This run ended at step ${c.steps.at(-1).step}.</span></div>` : "");
  tree.querySelectorAll(".trow[data-i]").forEach(el => el.addEventListener("click", () => { step = +el.dataset.i; sel.fill(0); render(true); }));
  tree.querySelectorAll(".span").forEach(el => el.addEventListener("click", () => { sel[ci] = +el.dataset.j; paint(ci); }));
}

function drawInspector(ci, box) {
  const st = stepOf(ci);
  if (!st) { box.innerHTML = `<h2><span>Ended</span></h2><div>This run ended at step ${D.conditions[ci].steps.at(-1).step}; the other design continues.</div>`; return; }
  const sp = st.spans[sel[ci]];
  box.innerHTML = `<h2><span>Step ${st.step} · ${sp.node} <span class="pill ${pillOf(sp.status)}">${sp.status}</span></span><span class="d">${dur(sp.duration_s)}</span></h2>
    <div>${sp.summary}</div>
    <h3>Input</h3><pre>${sp.input || "(see the files of this step)"}</pre>
    <h3>Output</h3><pre>${sp.output || "(see the files of this step)"}</pre>`;
}

function paint(ci) {
  const panel = $(`#panel-${ci}`); if (!panel) return;
  drawGraph(ci, $(".gsvg", panel)); drawTree(ci, $(".tree", panel)); drawInspector(ci, $(".inspector", panel));
}

function render(animate) {
  const shown = side ? D.conditions.map((_, i) => i) : [cond];
  $("#tabs").innerHTML = D.conditions.map((x, i) => `<button aria-pressed="${!side && i === cond}" data-i="${i}" style="--c:var(--${x.id})" ${side ? "disabled" : ""}>${x.label}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.addEventListener("click", () => { cond = +b.dataset.i; sel.fill(0); render(true); }));
  $("#panels").className = "panels" + (side ? " side" : "");
  $("#panels").innerHTML = shown.map(ci => `<div class="panel" id="panel-${ci}" style="--c:${colorOf(ci)}">
      <div class="ph"><span class="name">${D.conditions[ci].label}</span><span class="desc">${D.conditions[ci].desc || ""}</span></div>
      <div class="graph"><svg class="gsvg" viewBox="0 0 1600 450"></svg></div>
      <div class="body"><div class="tree"></div><div class="inspector"></div></div></div>`).join("");
  $("#stepno").textContent = `Step ${step} of ${maxStep - 1}`;
  $("#prev").disabled = step === 0; $("#next").disabled = step === maxStep - 1;
  shown.forEach(paint);
  if (animate && $("#auto").checked) animateSpans(shown);
}

function animateSpans(shown) {
  clearTimeout(timer); sel.fill(0); shown.forEach(paint);
  const longest = Math.max(...shown.map(ci => stepOf(ci) ? stepOf(ci).spans.length : 0));
  let k = 0;
  const tick = () => {
    k++;
    for (const ci of shown) { const st = stepOf(ci); if (st && k < st.spans.length) sel[ci] = k; }
    shown.forEach(paint);
    if (k < longest - 1) timer = setTimeout(tick, 650);
    else if (playing) timer = setTimeout(() => { if (step < maxStep - 1) { step++; render(true); } else { playing = false; $("#play").textContent = "Play"; } }, 900);
  };
  if (longest > 1) timer = setTimeout(tick, 650);
}
$("#prev").addEventListener("click", () => { clearTimeout(timer); step = Math.max(0, step - 1); sel.fill(0); render(true); });
$("#next").addEventListener("click", () => { clearTimeout(timer); step = Math.min(maxStep - 1, step + 1); sel.fill(0); render(true); });
$("#play").addEventListener("click", () => { playing = !playing; $("#play").textContent = playing ? "Pause" : "Play"; if (playing) { if (step === maxStep - 1) step = 0; sel.fill(0); render(true); } else clearTimeout(timer); });
$("#side").addEventListener("change", e => { side = e.target.checked; sel.fill(0); render(false); });
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") $("#next").click(); if (e.key === "ArrowLeft") $("#prev").click(); if (e.key === " ") { e.preventDefault(); $("#play").click(); } });
$("#ph").hidden = !D.placeholder;
render(false);
</script>
